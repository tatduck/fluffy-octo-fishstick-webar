<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tatduck</title>
    <!-- 引入 A-Frame 3D 引擎 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- 引入 MindAR 的 AR 追踪插件 -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- 微信拦截提示遮罩层 -->
    <div id="wechat-tip" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99999; color:white; text-align:center; padding-top:25vh; font-family: sans-serif;">
      <div style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">👉 请点击右上角 [...]</div>
      <div style="font-size: 18px; line-height: 1.6;">选择 <span style="color: #4CD964; font-weight: bold;">“在浏览器中打开”</span><br>即可正常体验 AR 效果</div>
    </div>

    <!-- 自动检测微信的脚本 -->
    <script>
      // 检测是否是微信内置浏览器
      function isWeChat() {
        var ua = navigator.userAgent.toLowerCase();
        return ua.indexOf('micromessenger') !== -1;
    }

      // 如果在微信中，就显示上面的提示层
      window.onload = function() {
        if (isWeChat()) {
          document.getElementById('wechat-tip').style.display = 'block';
        }
      }
    </script>
    
    <!-- AR 场景开始 -->
    <a-scene 
      mindar-image="imageTargetSrc: targets.mind; filterMinCF:0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <!-- 预加载你的 3D 模型 -->
      <a-assets>
        <a-asset-item id="myModel" src="model.glb"></a-asset-item>
      </a-assets>

      <!-- 摄像头视角 -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 识别图绑定：targetIndex: 0 代表识别第一张图 -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 调用你的 3D 模型：position是位置，scale是大小，rotation是旋转 -->
        <a-gltf-model src="#myModel" position="0 0 0" scale="0.1 0.1 0.1" rotation="-90 0 0"></a-gltf-model>
      </a-entity>
      
    </a-scene>
  </body>
</html>
